# Username only matteres if not using a Microsoft account
username=Player

# Change to False to not use a Microsoft account
use_microsoft_account=True

# Should use fabric (for mods)
# overridden by command line option --fabric-set
use_fabric=False

# Should use Omniarchive
# overridden by command line option --omniarchive-set
use_omniarchive=False

# Max RAM/Memory Minecraft can use
max_memory=4G

# Minimum RAM/Memory Minecraft can use
min_memory=2G

# Called "Game Data Directory" in the GUI,
# this is equivalent to what .minecraft is in the offical launcher
# overridden by command line option --data-dir
dot_minecraft_dir=default